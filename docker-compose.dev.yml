services:
  bff-shell-center-page:
    image: bff-shell-center-page:local
    container_name: bff-shell-center-page
    ports:
      - "4200:80"
    depends_on:
      bff-mfa-users:
        condition: service_started
      bff-mfa-accounts:
        condition: service_started
      bff-mfa-transactions:
        condition: service_started

  bff-mfa-users:
    image: bff-mfa-users:local
    container_name: bff-mfa-users
    expose:
      - "80"

  bff-mfa-accounts:
    image: bff-mfa-accounts:local
    container_name: bff-mfa-accounts
    expose:
      - "80"
  
  bff-mfa-transactions:
    image: bff-mfa-transactions:local
    container_name: bff-mfa-transactions
    expose:
      - "80"
